<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-labelledby="title desc">
  <title id="title">LITVING Inmobiliaria</title>
  <desc id="desc">Logotipo minimalista de Litving Inmobiliaria con un símbolo de conexión y un acento magenta.</desc>

  <!-- Símbolo: dos espacios abiertos que se encuentran en el centro -->
