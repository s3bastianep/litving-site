    <path d="M80 54h35c7 0 12 5 12 12v42c0 7-5 12-12 12H71"/>
    <path d="M71 120V82"/>
  </g>
  <rect x="66" y="69" width="15" height="15" rx="1" fill="#D41468"/>

  <!-- Wordmark -->
  <text x="172" y="83" fill="#102634"
